<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Player Lookup</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --danger: #f87171;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      background: color-mix(in oklab, var(--card) 86%, black);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    h1 { margin: 0 0 8px; font-size: clamp(1.4rem, 2.8vw, 2rem); }
    p { margin-top: 0; color: var(--muted); }
    .row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }

    input, button {
      border-radius: 10px;
      border: 1px solid #475569;
      font-size: 1rem;
      padding: 12px 14px;
    }

    input { flex: 1; min-width: 220px; background: #0b1221; color: var(--text); }

    button {
      background: linear-gradient(135deg, #0891b2, #0e7490);
      color: white;
      cursor: pointer;
      font-weight: 600;
      min-width: 150px;
    }

    button:disabled { opacity: 0.6; cursor: wait; }

    .result {
      background: #0b1221;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      line-height: 1.6;
    }

    .label { color: var(--muted); }
    .error { color: var(--danger); }
    .small { font-size: 0.9rem; color: var(--muted); margin-top: 12px; }
    h3 { margin: 12px 0 6px; font-size: 1rem; }
    ul { margin: 6px 0 0 18px; padding: 0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Roblox Player Lookup</h1>
    <p>Type a Roblox username to look up join date, last seen, top games, connections, and public location data.</p>

    <div class="row">
      <input id="username" type="text" placeholder="Enter Roblox username" maxlength="20" />
      <button id="lookup">Get Player Info</button>
    </div>

    <section id="result" class="result" aria-live="polite">
      Enter a username and click <strong>Get Player Info</strong>.
    </section>

    <div class="small">
      Uses endpoint fallbacks, input caching, and rate-limit cooldown to reduce request failures.
    </div>
  </main>

  <script>
    const input = document.getElementById('username');
    const button = document.getElementById('lookup');
    const result = document.getElementById('result');

    const cache = new Map();

    const fmt = (value) => {
      if (!value) return 'Not available';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
    };

    const esc = (value) => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');

    async function clearOldServiceWorkers() {
      if (!('serviceWorker' in navigator)) return;
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      } catch {
        // Ignore service worker cleanup failures.
      }
    }

    let rateLimitUntil = 0;

    function ensureNotRateLimited() {
      if (Date.now() < rateLimitUntil) {
        const secondsLeft = Math.ceil((rateLimitUntil - Date.now()) / 1000);
        throw new Error(`Rate limited by Roblox mirror. Please wait ${secondsLeft}s and try again.`);
      }
    }

    async function fetchJson(url, options = {}) {
      ensureNotRateLimited();

      const response = await fetch(url, { cache: 'no-store', ...options });
      if (response.status === 429) {
        rateLimitUntil = Date.now() + 60_000;
        throw new Error('Rate limited by Roblox mirror. Please wait 60s and try again.');
      }
      if (!response.ok) {
        throw new Error(`Request failed (${response.status})`);
      }
      return await response.json();
    }

    async function getUserIdByUsername(username) {
      const encoded = encodeURIComponent(username);
      const endpoints = [
        {
          url: `https://users.roproxy.com/v1/users/search?keyword=${encoded}&limit=10`,
          extractor: (data) => {
            const users = Array.isArray(data?.data) ? data.data : [];
            const match = users.find((u) => (u?.name || '').toLowerCase() === username.toLowerCase());
            return match?.id;
          }
        },
        {
          url: `https://api.roproxy.com/users/get-by-username?username=${encoded}`,
          extractor: (data) => data?.Id || data?.id
        }
      ];

      let hadRateLimit = false;
      let hadNetworkIssue = false;

      for (const endpoint of endpoints) {
        try {
          const data = await fetchJson(endpoint.url);
          const userId = endpoint.extractor(data);
          if (userId) return userId;
        } catch (error) {
          const message = String(error?.message || '');
          if (message.includes('Rate limited')) {
            hadRateLimit = true;
            break;
          }
          if (error instanceof TypeError || message.includes('Failed to fetch') || message.includes('ERR_NAME_NOT_RESOLVED')) {
            hadNetworkIssue = true;
          }
          // Try next endpoint.
        }
      }

      if (hadRateLimit) {
        throw new Error('Rate limited by Roblox mirror. Wait about 60 seconds before trying again.');
      }
      if (hadNetworkIssue) {
        throw new Error('Could not reach Roblox endpoints (network/DNS/CORS). Try again shortly.');
      }
      throw new Error('Username not found.');
    }

    async function getUserProfile(userId) {
      return fetchJson(`https://users.roproxy.com/v1/users/${userId}`);
    }

    async function getLastSeen(userId) {
      const endpoints = [
        {
          url: `https://presence.roproxy.com/v1/presence/last-online?userIds=${userId}`,
          extractor: (json) => json?.lastOnlineTimestamps?.[0]?.lastOnline || json?.lastOnlineTimestamps?.[0]
        },
        {
          url: `https://presence.roproxy.com/v1/presence/users?userIds=${userId}`,
          extractor: (json) => json?.userPresences?.[0]?.lastOnline
        },
        {
          url: `https://api.roproxy.com/users/${userId}/onlinestatus`,
          extractor: (json) => json?.LastOnline || json?.lastOnline
        }
      ];

      for (const endpoint of endpoints) {
        try {
          const data = await fetchJson(endpoint.url);
          const value = endpoint.extractor(data);
          if (value) return value;
        } catch {
          // Try next last-seen endpoint.
        }
      }

      return null;
    }

    async function getTopGames(userId) {
      try {
        const data = await fetchJson(`https://games.roproxy.com/v2/users/${userId}/games?accessFilter=Public&limit=10&sortOrder=Desc`);
        const games = Array.isArray(data?.data) ? data.data : [];
        return games.slice(0, 5).map((game) => game.name || game.rootPlace?.name).filter(Boolean);
      } catch {
        return [];
      }
    }

    async function getConnections(userId) {
      const endpoints = [
        { key: 'friends', url: `https://friends.roproxy.com/v1/users/${userId}/friends/count`, pick: (d) => d?.count },
        { key: 'followers', url: `https://friends.roproxy.com/v1/users/${userId}/followers/count`, pick: (d) => d?.count },
        { key: 'following', url: `https://friends.roproxy.com/v1/users/${userId}/followings/count`, pick: (d) => d?.count }
      ];

      const resultData = { friends: null, followers: null, following: null };

      await Promise.all(endpoints.map(async (endpoint) => {
        try {
          const data = await fetchJson(endpoint.url);
          const value = endpoint.pick(data);
          resultData[endpoint.key] = Number.isFinite(value) ? value : null;
        } catch {
          resultData[endpoint.key] = null;
        }
      }));

      return resultData;
    }

    async function getLocation(userId, profile) {
      const profileCandidates = [
        profile?.country,
        profile?.countryCode,
        profile?.locale,
        profile?.location
      ].filter(Boolean);

      if (profileCandidates.length) return profileCandidates[0];

      const endpoints = [
        {
          url: `https://www.roblox.com/users/profile/playerinfo?userId=${userId}`,
          extractor: (data) => data?.UserProfileInfo?.Location || data?.Location || data?.Country || data?.CountryCode
        },
        {
          url: `https://users.roproxy.com/v1/users/${userId}`,
          extractor: (data) => data?.country || data?.countryCode || data?.locale || data?.location
        }
      ];

      for (const endpoint of endpoints) {
        try {
          const data = await fetchJson(endpoint.url);
          const value = endpoint.extractor(data);
          if (value) return value;
        } catch {
          // Try next location endpoint.
        }
      }

      return 'Not shared publicly';
    }

    function renderGames(games) {
      if (!games.length) return '<div>Not available</div>';
      return `<ul>${games.map((game) => `<li>${esc(game)}</li>`).join('')}</ul>`;
    }

    function renderConnections(connections) {
      const f = (value) => (value === null ? 'Not available' : value.toLocaleString());
      return `
        <div><span class="label">Friends:</span> ${f(connections.friends)}</div>
        <div><span class="label">Followers:</span> ${f(connections.followers)}</div>
        <div><span class="label">Following:</span> ${f(connections.following)}</div>
      `;
    }

    async function lookup() {
      const username = input.value.trim();
      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
        result.innerHTML = '<span class="error">Enter a valid Roblox username (3-20 letters, numbers, underscores).</span>';
        return;
      }

      button.disabled = true;
      result.textContent = 'Looking up player info...';

      const key = username.toLowerCase();
      if (cache.has(key)) {
        result.innerHTML = cache.get(key);
        button.disabled = false;
        return;
      }

      try {
        const userId = await getUserIdByUsername(username);
        const profile = await getUserProfile(userId);
        const [lastSeen, topGames, connections, location] = await Promise.all([
          getLastSeen(userId),
          getTopGames(userId),
          getConnections(userId),
          getLocation(userId, profile)
        ]);

        const html = `
          <div><span class="label">Username:</span> <strong>${esc(profile.name || username)}</strong></div>
          <div><span class="label">Display Name:</span> ${esc(profile.displayName || 'Not available')}</div>
          <div><span class="label">User ID:</span> ${esc(profile.id || userId)}</div>
          <div><span class="label">Joined:</span> ${fmt(profile.created)}</div>
          <div><span class="label">Last Seen Online:</span> ${fmt(lastSeen)}</div>
          <div><span class="label">Location:</span> ${esc(location)}</div>
          <h3>Most Played / Recent Public Games</h3>
          ${renderGames(topGames)}
          <h3>Connections</h3>
          ${renderConnections(connections)}
        `;
        cache.set(key, html);
        result.innerHTML = html;
      } catch (error) {
        const message = error instanceof TypeError
          ? 'Could not contact Roblox endpoints (network/DNS/CORS). Try again in a minute.'
          : (error.message || 'Something went wrong.');
        result.innerHTML = `<span class="error">${message}</span>`;
      } finally {
        button.disabled = false;
      }
    }

    clearOldServiceWorkers();

    button.addEventListener('click', lookup);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') lookup();
    });
  </script>
</body>
</html>
